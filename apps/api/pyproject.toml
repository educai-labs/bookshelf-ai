[project]
name = "bookshelf-api"
version = "0.1.0"
description = "Bookshelf FastAPI backend (scaffold feature 006)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "supabase>=2.0,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1",
    "python-dotenv>=1.0,<2",
    "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "black>=24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Patrón estándar de FastAPI: Depends() en defaults de parámetros.
extend-immutable-calls = ["fastapi.Depends"]

[tool.black]
line-length = 100
target-version = ["py311"]
