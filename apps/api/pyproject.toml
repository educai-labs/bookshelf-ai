[project]
name = "bookshelf-api"
version = "0.1.0"
description = "Bookshelf FastAPI backend. Scaffold completo en feature 006; aquí solo test de integración RLS (feature 004)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "black>=24"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]