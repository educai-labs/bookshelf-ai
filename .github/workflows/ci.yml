# ============================================================
# Bookshelf — CI (feature 020 · Production Deployment)
# ============================================================
# Se ejecuta en pull requests y en push a `main`. Comprueba calidad y
# construibilidad de ambos servicios (frontend y backend) antes de permitir
# un merge, y sirve de dependencia (`needs: ci`) para el workflow `deploy.yml`.
#
# Jobs:
#   lint-frontend  → eslint + prettier (apps/web)
#   lint-backend   → ruff + black (apps/api)
#   test-frontend  → vitest (apps/web)
#   test-backend   → pytest (apps/api)
#   build-frontend → next build (apps/web)
#   build-backend  → docker build (apps/api)
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Permite reutilizar este workflow desde `deploy.yml` (job `ci`), de forma
  # que el despliegue pueda declarar `needs: ci` sin duplicar la lógica.
  workflow_call:

jobs:
  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint + prettier)
        run: npm run lint

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Instalación editable: el paquete `app` se resuelve desde el árbol
        # fuente, evitando que los `test_*.py` colocalizados se copien a
        # site-packages y provoquen `import file mismatch` al recoger pytest.
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test (vitest)
        run: npm run test

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Instalación editable (ver nota en `lint-backend`): el paquete `app`
        # se resuelve desde el árbol fuente y pytest no choca con los
        # `test_*.py` colocalizados copiados a site-packages por una
        # instalación no editable.
        run: pip install -e ".[dev]"
      - name: Test (pytest)
        run: pytest

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (next build)
        run: npm run build
        env:
          # `next build` recopila rutas (p. ej. /auth/callback) que importan el
          # client Supabase; sin estas variables (públicas, no secretas) el
          # build falla. Se usan placeholders de CI; Vercel inyecta los valores
          # reales en producción.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bookshelf-api .
      # Smoke test: arranca el contenedor sin variables de entorno (modo
      # development) y comprueba que `GET /health` responde 200. Detecta en PR
      # fallos de la imagen (p. ej. dependencias ausentes como `click` de
      # uvicorn) que de otro modo solo aparecerían al desplegar en Cloud Run.
      - name: Smoke test (GET /health -> 200)
        run: |
          CONTAINER="bookshelf-api-smoke"
          docker run -d --name "$CONTAINER" -p 18080:8000 bookshelf-api
          # Limpia el contenedor siempre, también si el smoke test falla.
          cleanup() { docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Espera a que la app responda (hasta ~60s; arranque + health check).
          code=""
          for i in $(seq 1 30); do
            if code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health 2>/dev/null)"; then
              [ "$code" = "200" ] && break
            fi
            sleep 2
          done
          echo "GET /health -> ${code:-timeout}"
          # Logs del contenedor para diagnóstico (sin secretos: solo arranque).
          docker logs "$CONTAINER" 2>&1 | tail -n 40 || true
          [ "$code" = "200" ]
