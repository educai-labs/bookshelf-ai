# ============================================================
# Bookshelf — CI (feature 020 · Production Deployment)
# ============================================================
# Se ejecuta en pull requests y en push a `main`. Comprueba calidad y
# construibilidad de ambos servicios (frontend y backend) antes de permitir
# un merge, y sirve de dependencia (`needs: ci`) para el workflow `deploy.yml`.
#
# Jobs:
#   lint-frontend  → eslint + prettier (apps/web)
#   lint-backend   → ruff + black (apps/api)
#   test-frontend  → vitest (apps/web)
#   test-backend   → pytest (apps/api)
#   build-frontend → next build (apps/web)
#   build-backend  → docker build (apps/api)
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Permite reutilizar este workflow desde `deploy.yml` (job `ci`), de forma
  # que el despliegue pueda declarar `needs: ci` sin duplicar la lógica.
  workflow_call:

jobs:
  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint + prettier)
        run: npm run lint

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test (vitest)
        run: npm run test

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Test (pytest)
        run: pytest

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (next build)
        run: npm run build
        env:
          # `next build` recopila rutas (p. ej. /auth/callback) que importan el
          # client Supabase; sin estas variables (públicas, no secretas) el
          # build falla. Se usan placeholders de CI; Vercel inyecta los valores
          # reales en producción.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bookshelf-api .
